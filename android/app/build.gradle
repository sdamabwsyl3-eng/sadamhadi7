def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def flutterSdkPath = localProperties.getProperty("flutter.sdk")
assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"

android {
    namespace "com.example.abayazeed"
    compileSdk 34
    ndkVersion flutter.ndkVersion
    defaultConfig {
        applicationId "com.example.abayazeed"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/flutter.gradle"
flutter {
    source "../.."
}
dependencies {}
